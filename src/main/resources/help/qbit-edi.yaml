- key: table:edi_transport;slot:help
  summary: Configure how you send and receive documents with a trading partner.
  content: |
    Select Type and Direction before filling in the connection settings for that delivery method. AS2 uses partner identities and certificates; SFTP uses a host, account, paths, and server fingerprint. HTTPS has its own address and authentication settings. Email delivery is not implemented. Store secret environment variable names in the reference fields, then use Test Connection to check the configured method.

    **How rows get created:** you add one with New, after the partner: pick the type and fill in its address and the NAMES of the environment variables holding passwords or keys (secrets are never stored). Then link it on the agreement as the inbound or outbound transport and run "Test Connection". It is host data and starts empty.
