  summary: Check a map against synthetic samples and download the preview results.
  content: |
    Select a Map or Map Sample, then review which synthetic samples to use. On a map, leave Sample blank to preview all saved samples or choose one sample. You can also upload a synthetic sample. Review the Result messages and download the preview output to investigate mapping problems before activation.
