- key: table:edi_map;slot:help
  summary: Define how document values correspond to your application records.
  content: |
    Choose the document type, direction, version, guide, and application table for the mapping. Add Map Rules to connect document values to record fields and define conversions. Use synthetic Samples with Preview Map to inspect the result. Activate Map validates field paths and assigns a revision before you use it in an Agreement Document.

    **How rows get created:** run "Install sample maps" to add the bundled synthetic examples as drafts with their guides, but without a partner or agreement document, or add your own with New. Point the map at your own table, adjust its rules, use "Preview Map" with a synthetic sample, then "Activate Map" and select it on the agreement document. Never use real PHI in samples.
