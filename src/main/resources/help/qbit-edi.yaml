- key: table:edi_guide;slot:help
  summary: Define the document structure and validation rules agreed with your partner.
  content: |
    Use an implementation guide to describe the segments, elements, and validation rules for a document type and version. Review its child records before activation. Create Partner Override makes a draft copy for a particular partner. Activate Guide checks the draft and assigns a new revision, retiring the previous active revision with the same name and partner.

    **How rows get created:** your administrator initializes the bundled X12, EDIFACT, and HIPAA guides. Initialization adds missing guides without overwriting existing records. Built-ins are read-only: use "Create Partner Override" to copy one for a partner, edit the draft, then "Activate Guide".
