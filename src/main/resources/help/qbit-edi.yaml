bundle: qbit-edi
version: ${project.version}
layer: QBIT
entries:
- key: app:edi;slot:help
  summary: Manage trading partners, document exchanges, validation, mapping, and delivery exceptions.
  content: |
    Use EDI to set up trading partners and monitor the documents you exchange.

    1. Add a Partner and Identities for your organization and the partner.
    2. Add an Agreement that pairs those identities, then Agreement Documents for each document type and direction.
    3. Configure a Transport and link it on the agreement. Add certificates if you use AS2 signing or encryption.
    4. Choose guides and maps for validation and conversion. Use synthetic samples to preview your maps before activation.

    Your administrator initializes the built-in guides and code lists. Use Setup status to see what still needs attention. In Activity, review Documents, Interchanges, and Exceptions; the home lists highlight failures, overdue acknowledgements, and expiring certificates.
- key: table:edi_partner;slot:help
  summary: Manage the trading partners you exchange documents with.
  content: |
    Start with your partner’s name, code, and contact details. Review Status and Contains PHI before you configure exchanges. Open the related Identities, Agreements, and Transports to connect the partner to document addressing and delivery settings. Use the related Documents, Interchanges, and Exceptions to investigate activity for that partner.

    **How rows get created:** you add one with New: a name and a short code. It is host data, so it starts empty. Next add the partner's identity and your own, then an agreement.
