- key: table:edi_inbox;slot:help
  summary: Review received messages, processing attempts, and stored document references.
  content: |
    Use Status, Attempts, Next Attempt At, and Last Error to understand incoming processing. The original document remains referenced by Payload Ref. Interchanges and Events show what processing produced. Reprocess queues the stored message again when it is not currently being processed. Download Raw Document provides the original content when your permissions allow it.

    **How rows get created:** automatically, when a transport receives a document: the AS2, HTTPS or file-gateway endpoints, or an SFTP poll. A worker then parses it into interchanges. It starts empty and is never typed in; "Reprocess" re-runs a document.
