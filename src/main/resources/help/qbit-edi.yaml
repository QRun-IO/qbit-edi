- key: table:edi_control_number;slot:help
  summary: Track the envelope number sequences used for your exchanges.
  content: |
    Use these records to inspect the envelope numbers allocated for an agreement or local identity. Level identifies the envelope being numbered, and Last Value shows the latest allocation. Min Value, Max Value, and Wrap Allowed define the sequence boundaries. Coordinate any changes with your partner so that new exchanges are not mistaken for duplicates.

    **How rows get created:** automatically, the first time a document is sent for a scope; the system then advances the number on every send. An administrator edits the last value only to resume numbering after a partner or system change.
