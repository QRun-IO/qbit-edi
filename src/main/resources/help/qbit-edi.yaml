- key: table:edi_outbound_request;slot:help
  summary: Track requests to turn business records into outgoing documents.
  content: |
    An outgoing request identifies the source business record and the Agreement Document used to turn it into an EDI document. Check Status and Attempts to follow preparation. Next Attempt At shows when another attempt is due, and Last Error helps you investigate failures before reviewing the resulting outbound delivery.

    **How rows get created:** automatically, when a record in a table the host lists for sending is created or changed, or when someone runs "Send As EDI" on a row. A worker builds the document and queues it as an outbound message.
