- key: table:edi_outbound_message;slot:help
  summary: Track assembled outgoing documents through delivery and retries.
  content: |
    Review Status, Attempts, Sent At, and Delivered At to follow delivery. Last Error and Next Attempt At explain retries. Resend queues the same stored content again; Resend As New creates another exchange with new envelope control numbers. Cancel is available only while a message is queued or waiting to retry.

    **How rows get created:** automatically, when a document is built for sending. A worker sends it over the agreement's transport, retries on failure, and records the transport delivery result. AS2 receipts can update delivery status; document acknowledgements are tracked separately. Use "Resend" or "Cancel" on a row.
