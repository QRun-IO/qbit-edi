- key: table:edi_identity;slot:help
  summary: Identify your organization and partners in document envelopes.
  content: |
    Use an identity to describe one side of an exchange. Partner links it to a trading partner; a local identity represents your organization. Match Interchange Qualifier, Interchange ID, and Application Code to the values agreed with your partner. Agreements then pair your local identity with the partner identity.

    **How rows get created:** you add them with New, after the partner. Add one with no partner for your own ID, and one per partner for theirs. Inbound documents are routed by matching these qualifiers and IDs, so they must match what the partner sends exactly. It is host data and starts empty.
