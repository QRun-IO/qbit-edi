- key: table:edi_exception;slot:help
  summary: Investigate document processing issues and record who is handling them.
  content: |
    Review Type, Summary, and Detail, then follow the linked message, interchange, or document to investigate. Assign selects the user responsible and marks the exception in progress. Use Resolution to record what you did. Mark Resolved or Ignore records the handling outcome; Reprocess separately queues the original incoming message when another attempt is appropriate.

    **How rows get created:** automatically, when processing fails or an acknowledgement is rejected or overdue. Work them from the home queue: "Assign", "Ignore" or "Mark Resolved". It starts empty, which is good.
