- key: process:edi_map_installSamples;slot:help
  summary: Add the bundled example maps as drafts without changing maps you already have.
  content: |
    Use **Install sample maps** on Maps; you do not need to select records. Review the missing samples before confirming. The action adds each map and its rules as a draft with a guide, without a partner or agreement document. Existing map names are skipped.

    Review the Result, select your own target table, and adjust the rules. Use synthetic samples with **Preview Map** before activating a map and selecting it on an Agreement Document.
- key: widget:edi_home_setup;slot:label
  summary: Check your setup progress and the next configuration step.
