- key: table:edi_agreement;slot:help
  summary: Set the identities, delivery methods, and exchange rules for a trading partner.
  content: |
    Choose the Partner, Local Identity, and Partner Identity, then check Standard and Usage Indicator. Configure the inbound and outbound delivery methods and the separators expected by the partner. Agreement Documents hold the rules for individual document types. Review duplicate handling and Apply Test Documents before enabling an agreement for use.

    **How rows get created:** you add one with New after the partner and both identities exist: pick your identity, the partner's identity, the standard and the usage indicator. Then set the inbound and outbound transports and add its documents. Without an agreement, inbound documents from that sender are rejected as unknown. It is host data and starts empty.

    Available standards: {{values:edi_standard}}. Check {{label:edi_agreement.usageIndicator}} before exchanging test or production documents.
