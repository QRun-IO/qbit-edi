- key: process:edi_exception_assign;slot:help
  summary: Assign an exception to a user and mark it in progress.
  content: |
    Select the exceptions you want someone to investigate and choose Assign. Enter the user identifier in Assign to user ID, review the selection, and confirm. The action records the assignee, changes the status to In progress, and sends an assignment notification. Review the Result for any records that could not be updated.
- key: process:edi_exception_assign;field:assignedToUserId
  summary: Enter the identifier of the user who will investigate the selected exceptions.
- key: process:edi_exception_ignore;slot:help
  summary: Mark selected exceptions ignored and record who handled them.
  content: |
    Review each exception and its related activity before choosing Ignore. After confirmation, the action changes the status to Ignored and records the handling user and time. Use Resolution to explain your decision. Ignoring an exception does not itself reprocess the original document or resend an outgoing message.
- key: process:edi_exception_resolve;slot:help
  summary: Mark selected exceptions resolved and record who handled them.
  content: |
    Investigate the exception and complete the necessary correction before choosing Mark Resolved. Review the selected records and confirm. The action changes their status to Resolved and records the handling user and time. Use Resolution to explain the correction; use Reprocess separately if the incoming document needs another attempt.
- key: process:edi_guide_override;slot:help
  summary: Create a draft implementation guide copy for a selected partner.
  content: |
    Select an Implementation Guide and choose Create Partner Override. Select the partner during Review and confirm the copy. The new draft includes the guide’s segments, elements, and rules, with references updated to the copied records. Review the partner-specific changes before activating the new guide for use.
- key: process:edi_guide_override;field:partnerId
  summary: Choose the trading partner for the new draft guide.
- key: process:edi_guide_activate;slot:help
  summary: Validate a draft and make it the active revision for its name and partner.
  content: |
    Select a draft and review the activation request before confirming. Activation validates the guide or map, assigns the next revision number, and retires the previous active revision with the same name and partner. Review the Result for validation failures, then check the Agreement Documents that use this definition.
- key: process:edi_map_activate;slot:help
  summary: Validate a draft and make it the active revision for its name and partner.
  content: |
    Select a draft and review the activation request before confirming. Activation validates the guide or map, assigns the next revision number, and retires the previous active revision with the same name and partner. Review the Result for validation failures, then check the Agreement Documents that use this definition.
- key: process:edi_inbox_worker;slot:help
  summary: Process queued incoming messages from encrypted storage.
  content: |
    Incoming messages are stored before this worker processes them. It picks up eligible messages and runs the incoming document flow. You can review progress in Inbound Messages, then follow Interchanges, Documents, Events, and Exceptions to understand the outcome. Check Attempts, Next Attempt At, and Last Error when processing needs attention.
- key: process:edi_outbound_message_resend;slot:help
  summary: Queue the same stored outgoing message for delivery again.
  content: |
    Select an outgoing message or its interchange and choose Resend. Review the selected records before confirming. The action queues the existing stored message again and resets its retry state. Check the Result and subsequent delivery status. Coordinate with your partner when repeat delivery could be treated as a duplicate.
- key: process:edi_outbound_message_new;slot:help
  summary: Create a new outgoing exchange with fresh envelope control numbers.
  content: |
    Choose Resend As New when you need another exchange based on the stored outgoing content. Review the selection carefully before confirming. The action creates a new interchange and outgoing message with fresh envelope control numbers. Check the resulting records and coordinate with your partner to avoid processing the same business document twice.
- key: process:edi_outbound_message_cancel;slot:help
  summary: Cancel an outgoing message that is queued or waiting to retry.
  content: |
    Select the outgoing message or its interchange and choose Cancel. Review the selection before confirming. Only queued messages and messages waiting to retry can be cancelled; the action rejects other states. Review the Result for records that could not be cancelled and check the current delivery status before taking further action.
- key: process:edi_interchange_resend;slot:help
  summary: Queue the same stored outgoing message for delivery again.
  content: |
    Select an outgoing message or its interchange and choose Resend. Review the selected records before confirming. The action queues the existing stored message again and resets its retry state. Check the Result and subsequent delivery status. Coordinate with your partner when repeat delivery could be treated as a duplicate.
- key: process:edi_interchange_new;slot:help
  summary: Create a new outgoing exchange with fresh envelope control numbers.
  content: |
    Choose Resend As New when you need another exchange based on the stored outgoing content. Review the selection carefully before confirming. The action creates a new interchange and outgoing message with fresh envelope control numbers. Check the resulting records and coordinate with your partner to avoid processing the same business document twice.
- key: process:edi_interchange_cancel;slot:help
  summary: Cancel an outgoing message that is queued or waiting to retry.
  content: |
    Select the outgoing message or its interchange and choose Cancel. Review the selection before confirming. Only queued messages and messages waiting to retry can be cancelled; the action rejects other states. Review the Result for records that could not be cancelled and check the current delivery status before taking further action.
- key: process:edi_transport_test;slot:help
  summary: Check the selected delivery connection using its configured method.
  content: |
    Select a Transport and choose Test Connection after reviewing the settings for its Type. Confirm the selection and read the Result for the connection check’s outcome. The check is performed by the selected delivery method, so use its reported details to correct the address, authentication references, certificates, or server verification settings.
- key: process:edi_certificate_promote;slot:help
  summary: Promote a certificate marked NEXT for active use.
  content: |
    Review the certificate’s identity, validity dates, and intended usage before choosing Promote Certificate. Only a certificate with status NEXT can be promoted. Confirm the selected record and review the Result. Check the related transport settings and coordinate the certificate change with your partner before relying on the new certificate.
- key: process:edi_certificate_export;slot:help
  summary: Download the selected public certificate in PEM format.
  content: |
    Select the certificate you need to share and choose Export Public Certificate. Review the selected record and confirm. The Result provides a PEM download containing the public certificate. Check Alias, Subject, Issuer, and validity dates so you send your partner the certificate intended for the relevant exchange.
- key: process:edi_certificate_export;field:downloadFileName
  summary: The filename offered for your downloadable result.
- key: process:edi_certificate_export;field:storageTableName
  summary: The storage location used to retrieve your downloadable result.
- key: process:edi_certificate_export;field:storageReference
  summary: The authorized storage reference for the downloadable result.
- key: process:edi_outbound_worker;slot:help
  summary: Build outgoing documents from eligible queued requests.
  content: |
    This worker turns eligible outgoing requests into documents using their agreement and mapping settings. You can follow the source record and Agreement Document from Outbound Request, then inspect the outgoing messages created for delivery. If preparation fails, review the request’s Status, Attempts, and Last Error before correcting the configuration.
- key: process:edi_send_worker;slot:help
  summary: Send eligible outgoing messages through their configured delivery method.
  content: |
    This worker attempts delivery of eligible outgoing messages through their configured Transport. You can follow Status, Attempts, Next Attempt At, and Last Error on Outbound Message. Sent At and Delivered At record delivery progress. Review the related interchange and receipts when you need to distinguish preparation, sending, and acknowledgement outcomes.
- key: process:edi_as2_mdn_sender;slot:help
  summary: Send pending asynchronous AS2 delivery receipts.
  content: |
    This worker sends AS2 receipts that require a separate delivery request. You can review the receipt’s Delivery URL, Delivery Status, Delivery Attempts, and Next Attempt At to follow progress. Original Message ID links the receipt to the acknowledged message. Check the configured delivery address when receipt delivery fails.
- key: process:edi_ack_monitor;slot:help
  summary: Find expected acknowledgements that have passed their due time.
  content: |
    This worker checks for acknowledgements that are still pending after their due time. You can use Overdue acknowledgements on the EDI home to identify groups needing attention and inspect Ack Due At and Ack Status. Review the associated exceptions and contact your partner when a document response is missing.
- key: process:edi_outbound_enqueue;slot:help
  summary: Create outgoing document requests from a supplied business record event.
  content: |
    This process accepts a source business record and its event identifier, then requests outgoing documents through the configured agreements. It is used by the application’s event integration. You can inspect Outbound Requests to see the selected Agreement Document, source record, processing status, and any errors before checking outgoing delivery.
