- key: table:edi_agreement_document;slot:help
  summary: Choose validation, mapping, and acknowledgement rules for one document type and direction.
  content: |
    Define one document type, direction, and version under an Agreement. Select the Guide and Map that should validate and convert those documents. Check Ack Expectation and Ack Due Minutes against your partner’s requirements. For outgoing documents, review the source records, trigger, and batch settings before making the configuration active.

    **How rows get created:** you add one per transaction set and direction with New, after the agreement: pick the set, version and direction, then the guide (built-in guides are ready) and the map that turns it into records. A document with no row here is not processed. It is host data and starts empty.
