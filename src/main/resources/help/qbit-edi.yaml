- key: table:edi_transaction;slot:help
  summary: Track an individual document from validation through mapping and acknowledgement.
  content: |
    Use Status, Ack Status, Error Count, and Warning Count to decide what needs attention. The related Validation Errors identify document locations that failed checks. Guide Revision and Map Revision record which definitions were used. Target Table Name and Target Record ID identify the business record associated with the processed document.

    **How rows get created:** automatically, as each document is validated and mapped (inbound) or built (outbound). It starts empty; "Reprocess" re-runs a document after a map or guide change.
