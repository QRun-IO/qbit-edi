- key: table:edi_interchange;slot:help
  summary: Review the envelope, processing status, and documents in an exchange.
  content: |
    Open an interchange to review the sender, receiver, control number, and processing status of an exchange. Functional Groups and Documents show the contents of the envelope; Events and Exceptions help explain processing outcomes. Download Raw Document requires the appropriate access. For incoming exchanges, Reprocess queues the original stored message for another attempt.

    **How rows get created:** automatically, when an inbound document is parsed and when an outbound document is enveloped. It starts empty; use "Reprocess", "Resend" or "Download Raw Document" on a row.
