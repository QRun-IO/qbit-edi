- key: process:edi_inbox_download;slot:help
  summary: Download the original stored document when your access allows it.
  content: |
    Select one incoming message or interchange and choose Download Raw Document. Review the selection before confirming. The Result provides the document download through authorized storage access. Use the original content to investigate parsing or validation issues, and handle downloaded documents according to the sensitivity of their contents.
