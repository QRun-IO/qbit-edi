- key: table:edi_certificate;slot:help
  summary: Manage public certificates and private key references used to secure exchanges.
  content: |
    Review the public certificate, Subject, Issuer, and validity dates before using it for an exchange. Private Key Env Var and Private Key Password Env Var refer to server environment variables. Promote Certificate handles a certificate marked NEXT. Export Public Certificate provides the public certificate for sharing with your trading partner.

    **How rows get created:** you add one with New: paste a partner's public certificate, or register your own with the environment variable NAMES that hold its private key. Only AS2 needs them. Expiring certificates raise an alert, and "Promote Certificate" switches a NEXT certificate to current. It is host data and starts empty.
